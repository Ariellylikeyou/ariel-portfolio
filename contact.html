<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Ariel Rojoca</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Main CSS -->
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<!-- ================= NAVBAR ================= -->
<header class="navbar">
  <div class="logo">
    <img src="assets/images/logo.png" alt="Ariel Rojoca Logo" class="logo-img">
  </div>

  <nav>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="projects.html">Projects</a></li>
      <li><a href="contact.html" class="active btn-nav">Contact</a></li>
    </ul>
  </nav>
</header>

<!-- ================= CONTACT SECTION ================= -->
<section class="section page-section">
  <h2 class="section-title">Let's Work Together</h2>

  <!-- Contact Form with EmailJS -->
  <form class="contact-form" id="contact-form">
    <input 
      type="text" 
      name="from_name" 
      placeholder="Your Name" 
      required>

    <input 
      type="email" 
      name="from_email" 
      placeholder="Your Email" 
      required>

    <textarea 
      name="message" 
      placeholder="Your Message" 
      required></textarea>

    <button type="submit" class="btn-primary">
      Send Message
    </button>
  </form>
</section>

<!-- ================= FOOTER ================= -->
<footer>
  <p>© 2026 Ariel Rojoca. All rights reserved.</p>
</footer>

<!-- ================= EMAILJS SCRIPT ================= -->
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script>
  // Initialize EmailJS with your Public Key
  emailjs.init("owa19qji0CTGnG5_M"); 

  // Contact Form Submission
  const contactForm = document.getElementById("contact-form");

  if (contactForm) {
    contactForm.addEventListener("submit", function(e) {
      e.preventDefault();

      emailjs.sendForm(
        "service_6pz8pvq",   // 🔥 Your Service ID
        "template_dy88p5d",  // 🔥 Your Template ID
        this
      )
      .then(() => {
        alert("✅ Message sent successfully!");
        contactForm.reset();
      })
      .catch((error) => {
        alert("❌ Failed to send message. Please try again.");
        console.error("EmailJS Error:", error);
      });
    });
  }
</script>

<!-- Main Script -->
<script src="assets/js/script.js"></script>

</body>
</html>
